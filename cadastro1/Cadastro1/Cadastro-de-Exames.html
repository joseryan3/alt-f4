
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro de Exames</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div class="cabecalho">
            <div class="logo">
                🏥
            </div>

            <div>
                <h1>Cadastro de Exames</h1>
                <p>Hospital Vida+</p>
            </div>
        </div>


        <div class="card">

            <h2>Dados do Exame</h2>

            <form id="formExame">

                <div class="linha">

                    <div class="campo">
                        <label for="paciente">
                            Nome do paciente
                        </label>

                        <input
                            type="text"
                            id="paciente"
                            placeholder="Digite o nome do paciente"
                            required
                        >
                    </div>


                    <div class="campo">
                        <label for="cpf">
                            CPF
                        </label>

                        <input
                            type="text"
                            id="cpf"
                            placeholder="000.000.000-00"
                            required
                        >
                    </div>

                </div>


                <div class="linha">

                    <div class="campo">
                        <label for="tipo">
                            Tipo de exame
                        </label>

                        <select id="tipo" required>

                            <option value="">
                                Selecione o exame
                            </option>

                            <option value="Hemograma">
                                Hemograma
                            </option>

                            <option value="Raio-X">
                                Raio-X
                            </option>

                            <option value="Ultrassonografia">
                                Ultrassonografia
                            </option>

                            <option value="Tomografia">
                                Tomografia
                            </option>

                            <option value="Ressonância Magnética">
                                Ressonância Magnética
                            </option>

                            <option value="Eletrocardiograma">
                                Eletrocardiograma
                            </option>

                        </select>
                    </div>


                    <div class="campo">
                        <label for="data">
                            Data do exame
                        </label>

                        <input
                            type="date"
                            id="data"
                            required
                        >
                    </div>

                </div>


                <div class="campo">

                    <label for="medico">
                        Médico responsável
                    </label>

                    <input
                        type="text"
                        id="medico"
                        placeholder="Digite o nome do médico"
                        required
                    >

                </div>


                <div class="campo">

                    <label for="observacoes">
                        Observações
                    </label>

                    <textarea
                        id="observacoes"
                        placeholder="Digite alguma observação sobre o exame..."
                    ></textarea>

                </div>


                <button type="submit">
                    Cadastrar Exame
                </button>

            </form>

        </div>


        <div class="card">

            <h2>Exames cadastrados</h2>

            <div class="tabela-container">

                <table>

                    <thead>

                        <tr>
                            <th>Paciente</th>
                            <th>CPF</th>
                            <th>Exame</th>
                            <th>Data</th>
                            <th>Médico</th>
                            <th>Ação</th>
                        </tr>

                    </thead>

                    <tbody id="listaExames">

                    </tbody>

                </table>

            </div>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
