
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro de Pedido de Exame</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <!-- CABEÇALHO -->

        <div class="cabecalho">

            <div class="logo">
                🏥
            </div>

            <div>
                <h1>Cadastro de Pedido de Exame</h1>
                <p>Hospital Vida+</p>
            </div>

        </div>


        <!-- FORMULÁRIO -->

        <div class="card">

            <h2>Dados do Pedido</h2>

            <form id="formPedido">

                <div class="linha">

                    <div class="campo">

                        <label for="numeroPedido">
                            Número do pedido
                        </label>

                        <input
                            type="text"
                            id="numeroPedido"
                            placeholder="Ex: PED-001"
                            required
                        >

                    </div>


                    <div class="campo">

                        <label for="data">
                            Data da solicitação
                        </label>

                        <input
                            type="date"
                            id="data"
                            required
                        >

                    </div>

                </div>


                <div class="linha">

                    <div class="campo">

                        <label for="paciente">
                            Nome do paciente
                        </label>

                        <input
                            type="text"
                            id="paciente"
                            placeholder="Digite o nome do paciente"
                            required
                        >

                    </div>


                    <div class="campo">

                        <label for="cpf">
                            CPF
                        </label>

                        <input
                            type="text"
                            id="cpf"
                            placeholder="000.000.000-00"
                            required
                        >

                    </div>

                </div>


                <div class="linha">

                    <div class="campo">

                        <label for="medico">
                            Médico solicitante
                        </label>

                        <input
                            type="text"
                            id="medico"
                            placeholder="Nome do médico"
                            required
                        >

                    </div>


                    <div class="campo">

                        <label for="tipoExame">
                            Exame solicitado
                        </label>

                        <select id="tipoExame" required>

                            <option value="">
                                Selecione o exame
                            </option>

                            <option value="Hemograma">
                                Hemograma
                            </option>

                            <option value="Raio-X">
                                Raio-X
                            </option>

                            <option value="Ultrassonografia">
                                Ultrassonografia
                            </option>

                            <option value="Tomografia">
                                Tomografia
                            </option>

                            <option value="Ressonância Magnética">
                                Ressonância Magnética
                            </option>

                            <option value="Eletrocardiograma">
                                Eletrocardiograma
                            </option>

                            <option value="Exame de Urina">
                                Exame de Urina
                            </option>

                        </select>

                    </div>

                </div>


                <div class="campo">

                    <label for="prioridade">
                        Prioridade
                    </label>

                    <select id="prioridade" required>

                        <option value="">
                            Selecione a prioridade
                        </option>

                        <option value="Normal">
                            Normal
                        </option>

                        <option value="Urgente">
                            Urgente
                        </option>

                    </select>

                </div>


                <div class="campo">

                    <label for="observacoes">
                        Observações / Justificativa
                    </label>

                    <textarea
                        id="observacoes"
                        placeholder="Digite a justificativa ou observações..."
                    ></textarea>

                </div>


                <button type="submit">
                    + Cadastrar Pedido
                </button>

            </form>

        </div>


        <!-- LISTA -->

        <div class="card">

            <h2>Pedidos de Exames</h2>

            <div class="tabela-container">

                <table>

                    <thead>

                        <tr>
                            <th>Pedido</th>
                            <th>Paciente</th>
                            <th>Exame</th>
                            <th>Médico</th>
                            <th>Data</th>
                            <th>Prioridade</th>
                            <th>Ação</th>
                        </tr>

                    </thead>

                    <tbody id="listaPedidos">

                    </tbody>

                </table>

            </div>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
