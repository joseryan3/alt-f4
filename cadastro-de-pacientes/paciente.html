
<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Cadastro de Pacientes</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 40px;
        }


        .container {
            max-width: 1100px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }


        h1 {
            margin-top: 0;
            color: #333;
        }


        h2 {
            margin-top: 35px;
            color: #444;
        }


        .secao {
            margin-top: 25px;
            margin-bottom: 15px;
            padding-bottom: 8px;
            border-bottom: 2px solid #007bff;
            color: #007bff;
        }


        .linha {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }


        .linha-3 {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 15px;
        }


        .form-group {
            margin-bottom: 15px;
        }


        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            color: #444;
        }


        input,
        select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 15px;
        }


        input:focus,
        select:focus {
            outline: none;
            border-color: #007bff;
        }


        .botoes {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }


        button {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 15px;
        }


        .btn-salvar {
            background: #007bff;
            color: white;
        }


        .btn-limpar {
            background: #6c757d;
            color: white;
        }


        .btn-editar {
            background: #ffc107;
            color: #212529;
            padding: 6px 10px;
            margin-right: 5px;
        }


        .btn-excluir {
            background: #dc3545;
            color: white;
            padding: 6px 10px;
        }


        button:hover {
            opacity: 0.9;
        }


        .pesquisa {
            margin-top: 20px;
        }


        table {
            width: 100%;
            margin-top: 15px;
            border-collapse: collapse;
        }


        th,
        td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }


        th {
            background: #007bff;
            color: white;
        }


        #mensagem {
            margin-top: 15px;
            font-weight: bold;
        }


        .sucesso {
            color: #198754;
        }


        .erro {
            color: #dc3545;
        }


        .status-ativo {
            color: #198754;
            font-weight: bold;
        }


        .status-inativo {
            color: #dc3545;
            font-weight: bold;
        }


        @media (max-width: 800px) {

            body {
                padding: 15px;
            }


            .container {
                padding: 20px;
            }


            .linha,
            .linha-3 {
                grid-template-columns: 1fr;
            }


            table {
                display: block;
                overflow-x: auto;
                white-space: nowrap;
                font-size: 12px;
            }

        }

    </style>

</head>


<body>


<div class="container">


    <h1>Cadastro de Pacientes</h1>


    <form id="formPaciente">


        <!-- =====================================
             DADOS PESSOAIS
        ====================================== -->

        <h3 class="secao">
            Dados Pessoais
        </h3>


        <div class="linha">


            <div class="form-group">

                <label for="nome">
                    Nome Completo
                </label>

                <input
                    type="text"
                    id="nome"
                    placeholder="Digite o nome completo"
                >

            </div>


            <div class="form-group">

                <label for="nomeSocial">
                    Nome Social
                </label>

                <input
                    type="text"
                    id="nomeSocial"
                    placeholder="Nome social, se houver"
                >

            </div>


        </div>


        <div class="linha-3">


            <div class="form-group">

                <label for="cpf">
                    CPF
                </label>

                <input
                    type="text"
                    id="cpf"
                    placeholder="000.000.000-00"
                    maxlength="14"
                >

            </div>


            <div class="form-group">

                <label for="dataNascimento">
                    Data de Nascimento
                </label>

                <input
                    type="date"
                    id="dataNascimento"
                >

            </div>


            <div class="form-group">

                <label for="sexo">
                    Sexo
                </label>

                <select id="sexo">

                    <option value="">
                        Selecione
                    </option>

                    <option value="Feminino">
                        Feminino
                    </option>

                    <option value="Masculino">
                        Masculino
                    </option>

                    <option value="Outro">
                        Outro
                    </option>

                    <option value="Não informado">
                        Não informado
                    </option>

                </select>

            </div>


        </div>


        <!-- =====================================
             DOCUMENTOS
        ====================================== -->

        <h3 class="secao">
            Documentos
        </h3>


        <div class="linha-3">


            <div class="form-group">

                <label for="rg">
                    RG
                </label>

                <input
                    type="text"
                    id="rg"
                    placeholder="Número do RG"
                >

            </div>


            <div class="form-group">

                <label for="cns">
                    Cartão SUS / CNS
                </label>

                <input
                    type="text"
                    id="cns"
                    placeholder="Número do CNS"
                    maxlength="15"
                >

            </div>


            <div class="form-group">

                <label for="estadoCivil">
                    Estado Civil
                </label>

                <select id="estadoCivil">

                    <option value="">
                        Selecione
                    </option>

                    <option value="Solteiro(a)">
                        Solteiro(a)
                    </option>

                    <option value="Casado(a)">
                        Casado(a)
                    </option>

                    <option value="Divorciado(a)">
                        Divorciado(a)
                    </option>

                    <option value="Viúvo(a)">
                        Viúvo(a)
                    </option>

                    <option value="União Estável">
                        União Estável
                    </option>

                </select>

            </div>


        </div>


        <!-- =====================================
             CONTATO
        ====================================== -->

        <h3 class="secao">
            Contato
        </h3>


        <div class="linha-3">


            <div class="form-group">

                <label for="telefone">
                    Telefone
                </label>

                <input
                    type="text"
                    id="telefone"
                    placeholder="(00) 00000-0000"
                    maxlength="15"
                >

            </div>


            <div class="form-group">

                <label for="celular">
                    Celular
                </label>

                <input
                    type="text"
                    id="celular"
                    placeholder="(00) 00000-0000"
                    maxlength="15"
                >

            </div>


            <div class="form-group">

                <label for="email">
                    E-mail
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="paciente@email.com"
                >

            </div>


        </div>


        <!-- =====================================
             ENDEREÇO
        ====================================== -->

        <h3 class="secao">
            Endereço
        </h3>


        <div class="linha-3">


            <div class="form-group">

                <label for="cep">
                    CEP
                </label>

                <input
                    type="text"
                    id="cep"
                    placeholder="00000-000"
                    maxlength="9"
                >

            </div>


            <div class="form-group">

                <label for="logradouro">
                    Logradouro
                </label>

                <input
                    type="text"
                    id="logradouro"
                    placeholder="Rua, Avenida..."
                >

            </div>


            <div class="form-group">

                <label for="numero">
                    Número
                </label>

                <input
                    type="text"
                    id="numero"
                    placeholder="Número"
                >

            </div>


        </div>


        <div class="linha-3">


            <div class="form-group">

                <label for="complemento">
                    Complemento
                </label>

                <input
                    type="text"
                    id="complemento"
                    placeholder="Apartamento, bloco..."
                >

            </div>


            <div class="form-group">

                <label for="bairro">
                    Bairro
                </label>

                <input
                    type="text"
                    id="bairro"
                    placeholder="Bairro"
                >

            </div>


            <div class="form-group">

                <label for="cidade">
                    Cidade
                </label>

                <select id="cidade">

                    <option value="">
                        Selecione a cidade
                    </option>

                    <option value="São Paulo - SP">
                        São Paulo - SP
                    </option>

                    <option value="Rio de Janeiro - RJ">
                        Rio de Janeiro - RJ
                    </option>

                    <option value="Belo Horizonte - MG">
                        Belo Horizonte - MG
                    </option>

                    <option value="Curitiba - PR">
                        Curitiba - PR
                    </option>

                    <option value="Salvador - BA">
                        Salvador - BA
                    </option>

                </select>

            </div>


        </div>


        <!-- =====================================
             DADOS DO CONVÊNIO
        ====================================== -->

        <h3 class="secao">
            Convênio
        </h3>


        <div class="linha-3">


            <div class="form-group">

                <label for="convenio">
                    Convênio
                </label>

                <select id="convenio">

                    <option value="">
                        Particular
                    </option>

                    <option value="Unimed">
                        Unimed
                    </option>

                    <option value="Bradesco Saúde">
                        Bradesco Saúde
                    </option>

                    <option value="Amil">
                        Amil
                    </option>

                    <option value="SulAmérica">
                        SulAmérica
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label for="numeroCarteirinha">
                    Nº da Carteirinha
                </label>

                <input
                    type="text"
                    id="numeroCarteirinha"
                    placeholder="Número da carteirinha"
                >

            </div>


            <div class="form-group">

                <label for="validadeCarteirinha">
                    Validade
                </label>

                <input
                    type="date"
                    id="validadeCarteirinha"
                >

            </div>


        </div>


        <!-- =====================================
             STATUS
        ====================================== -->

        <h3 class="secao">
            Situação do Cadastro
        </h3>


        <div class="form-group">

            <label for="status">
                Status
            </label>

            <select id="status">

                <option value="">
                    Selecione
                </option>

                <option value="Ativo">
                    Ativo
                </option>

                <option value="Inativo">
                    Inativo
                </option>

            </select>

        </div>


        <!-- =====================================
             BOTÕES
        ====================================== -->

        <div class="botoes">


            <button
                type="submit"
                class="btn-salvar"
                id="btnSalvar">

                Salvar

            </button>


            <button
                type="button"
                class="btn-limpar"
                onclick="limparFormulario()">

                Limpar

            </button>


        </div>


        <div id="mensagem"></div>


    </form>


    <!-- =====================================
         LISTAGEM
    ====================================== -->

    <h2>Pacientes Cadastrados</h2>


    <div class="pesquisa">

        <input
            type="text"
            id="pesquisa"
            placeholder="Pesquisar por nome, CPF ou telefone..."
            oninput="pesquisarPacientes()"
        >

    </div>


    <table>


        <thead>

            <tr>

                <th>Nome</th>

                <th>CPF</th>

                <th>Nascimento</th>

                <th>Telefone</th>

                <th>Cidade</th>

                <th>Convênio</th>

                <th>Status</th>

                <th>Ações</th>

            </tr>

        </thead>


        <tbody id="listaPacientes"></tbody>


    </table>


</div>


<script>


    // ==========================================
    // VARIÁVEIS
    // ==========================================

    const form =
        document.getElementById("formPaciente");


    const lista =
        document.getElementById("listaPacientes");


    const mensagem =
        document.getElementById("mensagem");


    const pesquisa =
        document.getElementById("pesquisa");


    let pacientes = [];


    let indiceEdicao = -1;



    // ==========================================
    // SALVAR / ATUALIZAR
    // ==========================================

    form.addEventListener(
        "submit",
        function(event) {

            event.preventDefault();


            const nome =
                document.getElementById("nome")
                    .value.trim();


            const nomeSocial =
                document.getElementById("nomeSocial")
                    .value.trim();


            const cpf =
                document.getElementById("cpf")
                    .value.trim();


            const dataNascimento =
                document.getElementById("dataNascimento")
                    .value;


            const sexo =
                document.getElementById("sexo")
                    .value;


            const rg =
                document.getElementById("rg")
                    .value.trim();


            const cns =
                document.getElementById("cns")
                    .value.trim();


            const estadoCivil =
                document.getElementById("estadoCivil")
                    .value;


            const telefone =
                document.getElementById("telefone")
                    .value.trim();


            const celular =
                document.getElementById("celular")
                    .value.trim();


            const email =
                document.getElementById("email")
                    .value.trim();


            const cep =
                document.getElementById("cep")
                    .value.trim();


            const logradouro =
                document.getElementById("logradouro")
                    .value.trim();


            const numero =
                document.getElementById("numero")
                    .value.trim();


            const complemento =
                document.getElementById("complemento")
                    .value.trim();


            const bairro =
                document.getElementById("bairro")
                    .value.trim();


            const cidade =
                document.getElementById("cidade")
                    .value;


            const convenio =
                document.getElementById("convenio")
                    .value;


            const numeroCarteirinha =
                document.getElementById("numeroCarteirinha")
                    .value.trim();


            const validadeCarteirinha =
                document.getElementById("validadeCarteirinha")
                    .value;


            const status =
                document.getElementById("status")
                    .value;



            // ==========================================
            // VALIDAÇÕES
            // ==========================================

            if (nome === "") {

                mostrarMensagem(
                    "Digite o nome completo do paciente.",
                    "erro"
                );

                return;
            }


            if (cpf === "") {

                mostrarMensagem(
                    "Digite o CPF do paciente.",
                    "erro"
                );

                return;
            }


            if (!validarCPF(cpf)) {

                mostrarMensagem(
                    "Digite um CPF válido.",
                    "erro"
                );

                return;
            }


            if (dataNascimento === "") {

                mostrarMensagem(
                    "Informe a data de nascimento.",
                    "erro"
                );

                return;
            }


            if (sexo === "") {

                mostrarMensagem(
                    "Selecione o sexo.",
                    "erro"
                );

                return;
            }


            if (celular === "") {

                mostrarMensagem(
                    "Digite o celular do paciente.",
                    "erro"
                );

                return;
            }


            if (cidade === "") {

                mostrarMensagem(
                    "Selecione a cidade.",
                    "erro"
                );

                return;
            }


            if (status === "") {

                mostrarMensagem(
                    "Selecione o status.",
                    "erro"
                );

                return;
            }



            // ==========================================
            // VERIFICAR CPF DUPLICADO
            // ==========================================

            const cpfDuplicado =
                pacientes.some(
                    function(paciente, index) {

                        return (
                            paciente.cpf === cpf &&
                            index !== indiceEdicao
                        );

                    }
                );


            if (cpfDuplicado) {

                mostrarMensagem(
                    "Já existe um paciente cadastrado com este CPF.",
                    "erro"
                );

                return;
            }



            // ==========================================
            // OBJETO PACIENTE
            // ==========================================

            const paciente = {

                nome: nome,

                nomeSocial: nomeSocial,

                cpf: cpf,

                dataNascimento: dataNascimento,

                sexo: sexo,

                rg: rg,

                cns: cns,

                estadoCivil: estadoCivil,

                telefone: telefone,

                celular: celular,

                email: email,

                cep: cep,

                logradouro: logradouro,

                numero: numero,

                complemento: complemento,

                bairro: bairro,

                cidade: cidade,

                convenio: convenio,

                numeroCarteirinha: numeroCarteirinha,

                validadeCarteirinha: validadeCarteirinha,

                status: status

            };



            // ==========================================
            // EDITAR
            // ==========================================

            if (indiceEdicao >= 0) {

                pacientes[indiceEdicao] =
                    paciente;


                indiceEdicao = -1;


                document
                    .getElementById("btnSalvar")
                    .textContent = "Salvar";


                mostrarMensagem(
                    "Paciente atualizado com sucesso!",
                    "sucesso"
                );

            }


            // ==========================================
            // NOVO CADASTRO
            // ==========================================

            else {

                pacientes.push(paciente);


                mostrarMensagem(
                    "Paciente cadastrado com sucesso!",
                    "sucesso"
                );

            }


            atualizarTabela();


            limparFormulario();

        }
    );



    // ==========================================
    // ATUALIZAR TABELA
    // ==========================================

    function atualizarTabela(
        pacientesExibir = pacientes
    ) {

        lista.innerHTML = "";


        pacientesExibir.forEach(
            function(paciente) {


                const index =
                    pacientes.indexOf(paciente);


                const linha =
                    document.createElement("tr");


                const classeStatus =
                    paciente.status === "Ativo"
                        ? "status-ativo"
                        : "status-inativo";


                linha.innerHTML = `

                    <td>
                        ${paciente.nome}
                    </td>

                    <td>
                        ${paciente.cpf}
                    </td>

                    <td>
                        ${formatarData(
                            paciente.dataNascimento
                        )}
                    </td>

                    <td>
                        ${paciente.celular}
                    </td>

                    <td>
                        ${paciente.cidade}
                    </td>

                    <td>
                        ${paciente.convenio || "Particular"}
                    </td>

                    <td class="${classeStatus}">
                        ${paciente.status}
                    </td>

                    <td>

                        <button
                            class="btn-editar"
                            onclick="editarPaciente(${index})">

                            Editar

                        </button>


                        <button
                            class="btn-excluir"
                            onclick="excluirPaciente(${index})">

                            Excluir

                        </button>

                    </td>

                `;


                lista.appendChild(linha);

            }
        );

    }



    // ==========================================
    // EDITAR
    // ==========================================

    function editarPaciente(index) {

        const paciente =
            pacientes[index];


        document.getElementById("nome").value =
            paciente.nome;


        document.getElementById("nomeSocial").value =
            paciente.nomeSocial;


        document.getElementById("cpf").value =
            paciente.cpf;


        document.getElementById("dataNascimento").value =
            paciente.dataNascimento;


        document.getElementById("sexo").value =
            paciente.sexo;


        document.getElementById("rg").value =
            paciente.rg;


        document.getElementById("cns").value =
            paciente.cns;


        document.getElementById("estadoCivil").value =
            paciente.estadoCivil;


        document.getElementById("telefone").value =
            paciente.telefone;


        document.getElementById("celular").value =
            paciente.celular;


        document.getElementById("email").value =
            paciente.email;


        document.getElementById("cep").value =
            paciente.cep;


        document.getElementById("logradouro").value =
            paciente.logradouro;


        document.getElementById("numero").value =
            paciente.numero;


        document.getElementById("complemento").value =
            paciente.complemento;


        document.getElementById("bairro").value =
            paciente.bairro;


        document.getElementById("cidade").value =
            paciente.cidade;


        document.getElementById("convenio").value =
            paciente.convenio;


        document.getElementById("numeroCarteirinha").value =
            paciente.numeroCarteirinha;


        document.getElementById("validadeCarteirinha").value =
            paciente.validadeCarteirinha;


        document.getElementById("status").value =
            paciente.status;


        indiceEdicao = index;


        document.getElementById(
            "btnSalvar"
        ).textContent = "Atualizar";


        window.scrollTo({

            top: 0,

            behavior: "smooth"

        });

    }



    // ==========================================
    // EXCLUIR
    // ==========================================

    function excluirPaciente(index) {

        const confirmacao =
            confirm(
                "Deseja realmente excluir este paciente?"
            );


        if (!confirmacao) {
            return;
        }


        pacientes.splice(index, 1);


        atualizarTabela();


        mostrarMensagem(
            "Paciente excluído com sucesso.",
            "sucesso"
        );

    }



    // ==========================================
    // LIMPAR
    // ==========================================

    function limparFormulario() {

        form.reset();


        indiceEdicao = -1;


        document.getElementById(
            "btnSalvar"
        ).textContent = "Salvar";

    }



    // ==========================================
    // PESQUISA
    // ==========================================

    function pesquisarPacientes() {

        const texto =
            pesquisa.value
                .toLowerCase()
                .trim();


        const resultado =
            pacientes.filter(
                function(paciente) {

                    return (

                        paciente.nome
                            .toLowerCase()
                            .includes(texto)

                        ||

                        paciente.cpf
                            .includes(texto)

                        ||

                        paciente.celular
                            .includes(texto)

                        ||

                        paciente.cidade
                            .toLowerCase()
                            .includes(texto)

                    );

                }
            );


        atualizarTabela(resultado);

    }



    // ==========================================
    // MÁSCARA CPF
    // ==========================================

    document
        .getElementById("cpf")
        .addEventListener(
            "input",
            function(event) {

                let valor =
                    event.target.value
                        .replace(/\D/g, "")
                        .substring(0, 11);


                if (valor.length > 9) {

                    valor =
                        valor.replace(
                            /^(\d{3})(\d{3})(\d{3})(\d{2}).*/,
                            "$1.$2.$3-$4"
                        );

                }

                else if (valor.length > 6) {

                    valor =
                        valor.replace(
                            /^(\d{3})(\d{3})(\d{1,3}).*/,
                            "$1.$2.$3"
                        );

                }

                else if (valor.length > 3) {

                    valor =
                        valor.replace(
                            /^(\d{3})(\d{1,3}).*/,
                            "$1.$2"
                        );

                }


                event.target.value = valor;

            }
        );



    // ==========================================
    // MÁSCARA TELEFONE
    // ==========================================

    function aplicarMascaraTelefone(id) {

        document
            .getElementById(id)
            .addEventListener(
                "input",
                function(event) {

                    let valor =
                        event.target.value
                            .replace(/\D/g, "")
                            .substring(0, 11);


                    if (valor.length > 10) {

                        valor =
                            valor.replace(
                                /^(\d{2})(\d{5})(\d{4}).*/,
                                "($1) $2-$3"
                            );

                    }

                    else if (valor.length > 6) {

                        valor =
                            valor.replace(
                                /^(\d{2})(\d{4})(\d{1,4}).*/,
                                "($1) $2-$3"
                            );

                    }

                    else if (valor.length > 2) {

                        valor =
                            valor.replace(
                                /^(\d{2})(\d{1,5}).*/,
                                "($1) $2"
                            );

                    }


                    event.target.value = valor;

                }
            );

    }


    aplicarMascaraTelefone("telefone");

    aplicarMascaraTelefone("celular");



    // ==========================================
    // MÁSCARA CEP
    // ==========================================

    document
        .getElementById("cep")
        .addEventListener(
            "input",
            function(event) {

                let valor =
                    event.target.value
                        .replace(/\D/g, "")
                        .substring(0, 8);


                if (valor.length > 5) {

                    valor =
                        valor.replace(
                            /^(\d{5})(\d{1,3}).*/,
                            "$1-$2"
                        );

                }


                event.target.value = valor;

            }
        );



    // ==========================================
    // MÁSCARA CNS
    // ==========================================

    document
        .getElementById("cns")
        .addEventListener(
            "input",
            function(event) {

                event.target.value =
                    event.target.value
                        .replace(/\D/g, "")
                        .substring(0, 15);

            }
        );



    // ==========================================
    // VALIDAÇÃO CPF
    // ==========================================

    function validarCPF(cpf) {

        cpf =
            cpf.replace(/\D/g, "");


        if (cpf.length !== 11) {
            return false;
        }


        if (/^(\d)\1+$/.test(cpf)) {
            return false;
        }


        let soma = 0;


        for (let i = 0; i < 9; i++) {

            soma +=
                parseInt(cpf.charAt(i))
                * (10 - i);

        }


        let resto =
            (soma * 10) % 11;


        if (resto === 10) {
            resto = 0;
        }


        if (
            resto !==
            parseInt(cpf.charAt(9))
        ) {

            return false;

        }


        soma = 0;


        for (let i = 0; i < 10; i++) {

            soma +=
                parseInt(cpf.charAt(i))
                * (11 - i);

        }


        resto =
            (soma * 10) % 11;


        if (resto === 10) {
            resto = 0;
        }


        return (
            resto ===
            parseInt(cpf.charAt(10))
        );

    }



    // ==========================================
    // FORMATAR DATA
    // ==========================================

    function formatarData(data) {

        if (!data) {
            return "-";
        }


        const partes =
            data.split("-");


        return (
            partes[2] +
            "/" +
            partes[1] +
            "/" +
            partes[0]
        );

    }



    // ==========================================
    // MENSAGEM
    // ==========================================

    function mostrarMensagem(
        texto,
        tipo
    ) {

        mensagem.textContent = texto;

        mensagem.className = tipo;


        setTimeout(function() {

            mensagem.textContent = "";

        }, 3000);

    }
