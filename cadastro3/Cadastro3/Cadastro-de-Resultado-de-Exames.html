
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro de Resultado de Exames</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <!-- CABEÇALHO -->

        <div class="cabecalho">

            <div class="logo">
                🏥
            </div>

            <div>
                <h1>Cadastro de Resultado de Exames</h1>
                <p>Hospital Vida+</p>
            </div>

        </div>


        <!-- FORMULÁRIO -->

        <div class="card">

            <h2>Dados do Resultado</h2>

            <form id="formResultado">

                <div class="linha">

                    <div class="campo">

                        <label for="numeroResultado">
                            Número do resultado
                        </label>

                        <input
                            type="text"
                            id="numeroResultado"
                            placeholder="Ex: RES-001"
                            required
                        >

                    </div>


                    <div class="campo">

                        <label for="data">
                            Data do exame
                        </label>

                        <input
                            type="date"
                            id="data"
                            required
                        >

                    </div>

                </div>


                <div class="linha">

                    <div class="campo">

                        <label for="paciente">
                            Nome do paciente
                        </label>

                        <input
                            type="text"
                            id="paciente"
                            placeholder="Digite o nome do paciente"
                            required
                        >

                    </div>


                    <div class="campo">

                        <label for="cpf">
                            CPF
                        </label>

                        <input
                            type="text"
                            id="cpf"
                            placeholder="000.000.000-00"
                            required
                        >

                    </div>

                </div>


                <div class="linha">

                    <div class="campo">

                        <label for="tipoExame">
                            Tipo de exame
                        </label>

                        <select id="tipoExame" required>

                            <option value="">
                                Selecione o exame
                            </option>

                            <option value="Hemograma">
                                Hemograma
                            </option>

                            <option value="Raio-X">
                                Raio-X
                            </option>

                            <option value="Ultrassonografia">
                                Ultrassonografia
                            </option>

                            <option value="Tomografia">
                                Tomografia
                            </option>

                            <option value="Ressonância Magnética">
                                Ressonância Magnética
                            </option>

                            <option value="Eletrocardiograma">
                                Eletrocardiograma
                            </option>

                            <option value="Exame de Urina">
                                Exame de Urina
                            </option>

                        </select>

                    </div>


                    <div class="campo">

                        <label for="medico">
                            Médico responsável
                        </label>

                        <input
                            type="text"
                            id="medico"
                            placeholder="Nome do médico"
                            required
                        >

                    </div>

                </div>


                <div class="campo">

                    <label for="status">
                        Status do exame
                    </label>

                    <select id="status" required>

                        <option value="">
                            Selecione o status
                        </option>

                        <option value="Concluído">
                            Concluído
                        </option>

                        <option value="Pendente">
                            Pendente
                        </option>

                        <option value="Em análise">
                            Em análise
                        </option>

                    </select>

                </div>


                <div class="campo">

                    <label for="resultado">
                        Resultado
                    </label>

                    <textarea
                        id="resultado"
                        placeholder="Digite o resultado do exame..."
                        required
                    ></textarea>

                </div>


                <div class="campo">

                    <label for="observacoes">
                        Observações
                    </label>

                    <textarea
                        id="observacoes"
                        placeholder="Digite alguma observação..."
                    ></textarea>

                </div>


                <button type="submit">
                    + Cadastrar Resultado
                </button>

            </form>

        </div>


        <!-- TABELA DE RESULTADOS -->

        <div class="card">

            <h2>Resultados cadastrados</h2>

            <div class="tabela-container">

                <table>

                    <thead>

                        <tr>
                            <th>Nº</th>
                            <th>Paciente</th>
                            <th>Exame</th>
                            <th>Data</th>
                            <th>Médico</th>
                            <th>Status</th>
                            <th>Ação</th>
                        </tr>

                    </thead>

                    <tbody id="listaResultados">

                    </tbody>

                </table>

            </div>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
